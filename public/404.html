<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>পৃষ্ঠাটি পাওয়া যায়নি (404) — PolliBazar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Hind Siliguri', sans-serif;
        background: #fafaf9;
        color: #1c1917;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        background: white;
        border: 1px solid #e7e5e4;
        border-radius: 1rem;
        padding: 2.5rem;
        max-width: 480px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      .badge {
        display: inline-block;
        background: #fef2f2;
        color: #b91c1c;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.75rem; margin: 0 0 0.5rem 0; color: #1c1917; }
      p { color: #78716c; font-size: 0.95rem; line-height: 1.5; margin: 0 0 1.5rem 0; }
      .btn {
        display: inline-block;
        background: #047857;
        color: white;
        padding: 0.65rem 1.5rem;
        border-radius: 0.5rem;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        transition: background 0.2s;
      }
      .btn:hover { background: #065f46; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">ত্রুটি ৪০৪</div>
      <h1>পৃষ্ঠাটি পাওয়া যায়নি</h1>
      <p>আপনি যে পৃষ্ঠাটি খুঁজছেন তা হয়তো সরানো হয়েছে অথবা লিংকটি পরিবর্তিত হয়েছে। হোমপেজে ফিরে গিয়ে কেনাকাটা চালিয়ে যেতে পারেন।</p>
      <a href="/" class="btn">হোমপেজে ফিরে যান</a>
    </div>
  </body>
</html>
